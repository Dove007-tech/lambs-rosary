<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>54-Day Novena Pilgrimage Tracker</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: #E8F5E9; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; box-sizing: border-box; }
        .app-title { font-size: 24px; font-weight: 800; color: #1B5E20; margin: 15px 0 5px 0; font-family: Georgia, serif; text-align: center; }
        .grid-chart-title { font-size: 13px; font-weight: 800; color: #4CAF50; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; text-align: center; }
        
        .mountain-map { width: 360px; height: 130px; background-color: #A5D6A7; border-radius: 25px; position: relative; overflow: hidden; border: 4px solid #81C784; box-shadow: inset 0 0 20px rgba(0,0,0,0.05); margin-bottom: 15px; display: flex; justify-content: center; align-items: center; }
        .crown-box { width: 64px; height: 64px; border-radius: 32px; border: 4px solid #FFD54F; background-color: #FFF; display: flex; justify-content: center; align-items: center; font-size: 28px; transition: all 0.3s ease; }
        .crown-box.garlanded { background-color: #FFF0F5; border-color: #FF69B4; box-shadow: 0 0 15px #FF69B4; }
        
        .milestone-alert { width: 100%; max-width: 360px; background-color: #FFF9C4; border: 2px solid #2E7D32; border-radius: 14px; padding: 14px; margin-bottom: 15px; box-sizing: border-box; text-align: center; font-size: 14px; font-weight: 700; color: #1B5E20; white-space: pre-line; box-shadow: 0 4px 8px rgba(0,0,0,0.05); min-height: 80px; display: flex; align-items: center; justify-content: center; }
        
        /* 📅 Stacking Layout Grid Container Frame */
        .novena-grid-container { width: 100%; max-width: 360px; position: relative; margin-bottom: 15px; background-color: #FFF; border-radius: 18px; padding: 12px; box-sizing: border-box; border: 2px solid #A5D6A7; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .novena-grid { display: flex; flex-direction: column-reverse; gap: 6px; width: 100%; }
        .grid-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; width: 100%; }
        
        .grid-day { height: 42px; background-color: #F5F5F5; border: 1px solid #E0E0E0; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: 700; color: #616161; transition: all 0.2s; position: relative; }
        .grid-day.passed { background-color: #2E7D32; border-color: #1B5E20; color: #FFF; }
        .grid-day.current { background-color: #81C784; border-color: #2E7D32; color: #FFF; font-size: 14px; }
        
        /* 🐑 Leaping Pilgrim Sheep Layer Mapping Layout */
        .lamb-actor { position: absolute; width: 34px; height: 34px; background-color: #FFFFFF; border: 2px solid #1B5E20; border-radius: 17px; display: flex; justify-content: center; align-items: center; font-size: 18px; box-shadow: 0 3px 6px rgba(0,0,0,0.2); z-index: 20; transform: translate(-50%, -50%); transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: none; pointer-events: none; }
        
        .action-btn { width: 100%; max-width: 360px; background-color: #1B5E20; color: #FFF; border: none; padding: 16px; border-radius: 30px; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 10px; box-shadow: 0 4px 8px rgba(27,94,32,0.2); -webkit-tap-highlight-color: transparent; }
        .action-btn:active { transform: scale(0.99); }
        .reset-btn { background: none; border: none; color: #757575; font-size: 12px; font-weight: 600; cursor: pointer; padding: 8px; text-transform: uppercase; width: 100%; text-align: center; margin-top: 5px; }
    </style>
</head>

                        dayBox.classList.add('current');
